name: release

# Publishes `insider`, then `insider_lab`, to Hex when a push to `main`
# changes their version, then tags the published commit `vVERSION`.
# `check` reads the version of both packages and asks Hex and the remote what
# is missing. `publish` does only that, and every step looks again before it
# acts, so a run started with workflow_dispatch finishes a release that
# failed or waited too long for approval.
#
# The first release of each package is published by hand, because a Hex
# workload identity cannot create a package or publish its first release.
# docs/development.md "Releasing" has both procedures.
#
# This job holds no Hex key. With no API key in its environment, each `mix hex.publish`
# exchanges a fresh GitHub OIDC token for a short-lived Hex key, through the
# workload identity of the Hex organization `clarity`, which owns both
# packages. The identity names this repository, this file and the `release`
# environment, which admits only `main`. Staged publishing then holds each
# release until a maintainer with 2FA approves it on hex.pm. That approval is
# the human gate. Required reviewers on the environment would add a second
# one before the job starts, and the workflow works either way.

on:
  push:
    branches: [main]
    paths:
      - mix.exs
      - tools/insider_lab/mix.exs
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the version against Hex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_core: ${{ steps.hex.outputs.publish_core }}
      publish_lab: ${{ steps.hex.outputs.publish_lab }}
      publish: ${{ steps.hex.outputs.publish }}
      tag_exists: ${{ steps.tag.outputs.tag_exists }}
    steps:
      - name: Refuse a ref other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases publish from main only, not ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Elixir's Version module compares versions by SemVer precedence.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Read the version of both packages
        id: version
        run: |
          core_version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          lab_version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' tools/insider_lab/mix.exs)"
          echo "insider ${core_version}, insider_lab ${lab_version}"
          if [ -z "$core_version" ] || [ "$core_version" != "$lab_version" ]; then
            echo "::error::Both mix.exs files must set the same @version."
            exit 1
          fi
          echo "version=${core_version}" >> "$GITHUB_OUTPUT"
      # A version Hex lacks is published only when it is greater than every
      # release of that package, pre-releases included.
      - name: Ask Hex which packages need the version
        id: hex
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GREATER_THAN_ALL: |
            [version | releases] = System.argv()

            case Enum.reject(releases, &(Version.compare(version, &1) == :gt)) do
              [] -> :ok
              not_older ->
                IO.puts("#{version} is not greater than #{Enum.join(not_older, ", ")}")
                System.halt(1)
            end
        run: |
          publish=false
          for entry in core:insider lab:insider_lab; do
            key="${entry%%:*}"
            package="${entry#*:}"
            status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
              "https://hex.pm/api/packages/${package}/releases/${VERSION}")"
            case "$status" in
              200)
                echo "${package} ${VERSION} is on Hex."
                echo "publish_${key}=false" >> "$GITHUB_OUTPUT"
                ;;
              404)
                releases_json="$(curl --silent --show-error --fail --retry 3 "https://hex.pm/api/packages/${package}")"
                mapfile -t releases < <(jq --raw-output '.releases[].version' <<< "$releases_json")
                if [ "${#releases[@]}" -eq 0 ]; then
                  echo "::error::Hex lists no release of ${package}. Publish its first release by hand."
                  exit 1
                fi
                if ! elixir -e "$GREATER_THAN_ALL" "$VERSION" "${releases[@]}"; then
                  echo "::error::${package} ${VERSION} is not on Hex and is not greater than its releases there. Refusing to publish."
                  exit 1
                fi
                echo "${package} ${VERSION} is not on Hex yet, or waits for approval."
                echo "publish_${key}=true" >> "$GITHUB_OUTPUT"
                publish=true
                ;;
              *)
                echo "::error::hex.pm answered ${status} for ${package} ${VERSION}."
                exit 1
                ;;
            esac
          done
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
      - name: Look for the tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.hex.outputs.publish }}
        run: |
          code=0
          git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null || code=$?
          case "$code" in
            0) tag_exists=true ;;
            2) tag_exists=false ;;
            *)
              echo "::error::git ls-remote failed with status ${code}."
              exit 1
              ;;
          esac
          echo "tag v${VERSION} exists: ${tag_exists}"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = false ] && [ "$tag_exists" = true ]; then
            echo "::notice::insider and insider_lab ${VERSION} are on Hex and tagged v${VERSION}. Nothing to release."
          fi

  publish:
    name: Publish to Hex and tag
    needs: check
    if: needs.check.outputs.publish == 'true' || needs.check.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    environment: release
    # Two approvals can take up to 60 minutes each.
    timeout-minutes: 150
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token stays out of .git/config, so the build and the
          # dependencies it runs cannot push. Only the tag step receives it.
          persist-credentials: false
      # Workload identity needs OTP 27 or later.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        if: needs.check.outputs.publish == 'true'
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - if: needs.check.outputs.publish == 'true'
        run: mix deps.get --check-locked
      # A release that waits for approval is not on Hex, so publishing it
      # again stages it again. Approve the newest staged release.
      - name: Publish insider
        if: needs.check.outputs.publish_core == 'true'
        run: |
          status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            "https://hex.pm/api/packages/insider/releases/${VERSION}")"
          case "$status" in
            200) echo "insider ${VERSION} is already on Hex." ;;
            404) mix hex.publish --yes ;;
            *)
              echo "::error::hex.pm answered ${status} for insider ${VERSION}."
              exit 1
              ;;
          esac
      # The Lab depends on `insider ~> VERSION` from Hex, so it can only
      # resolve after the core release is approved and available.
      - name: Wait until insider ${{ needs.check.outputs.version }} is on Hex
        env:
          PACKAGE: insider
        run: |
          url="https://hex.pm/api/packages/${PACKAGE}/releases/${VERSION}"
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null "$url"; then
              echo "${PACKAGE} ${VERSION} is on Hex."
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "::notice::${PACKAGE} ${VERSION} waits for approval. A maintainer with 2FA approves it under Staged releases on hex.pm. Waiting up to 60 minutes."
            fi
            sleep 30
          done
          echo "::error::${PACKAGE} ${VERSION} is not on Hex after 60 minutes. Approve the staged release on hex.pm (https://hex.pm/dashboard/staged-releases/hexpm/${PACKAGE}/${VERSION}), then run this workflow again on main with workflow_dispatch."
          exit 1
      # INSIDER_LAB_HEX=1 makes the Lab depend on the core from Hex, not by
      # path, with its own deps and lockfile. The root lockfile seeds that
      # lockfile, so the shared dependencies keep their locked versions.
      - name: Publish insider_lab
        if: needs.check.outputs.publish_lab == 'true'
        working-directory: tools/insider_lab
        env:
          INSIDER_LAB_HEX: "1"
        run: |
          status="$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            "https://hex.pm/api/packages/insider_lab/releases/${VERSION}")"
          case "$status" in
            200) echo "insider_lab ${VERSION} is already on Hex." ;;
            404)
              cp ../../mix.lock mix.lock
              mix deps.get
              mix hex.publish --yes
              ;;
            *)
              echo "::error::hex.pm answered ${status} for insider_lab ${VERSION}."
              exit 1
              ;;
          esac
      - name: Wait until insider_lab ${{ needs.check.outputs.version }} is on Hex
        env:
          PACKAGE: insider_lab
        run: |
          url="https://hex.pm/api/packages/${PACKAGE}/releases/${VERSION}"
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null "$url"; then
              echo "${PACKAGE} ${VERSION} is on Hex."
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "::notice::${PACKAGE} ${VERSION} waits for approval. A maintainer with 2FA approves it under Staged releases on hex.pm. Waiting up to 60 minutes."
            fi
            sleep 30
          done
          echo "::error::${PACKAGE} ${VERSION} is not on Hex after 60 minutes. Approve the staged release on hex.pm (https://hex.pm/dashboard/staged-releases/hexpm/${PACKAGE}/${VERSION}), then run this workflow again on main with workflow_dispatch."
          exit 1
      # The tag names the commit that published the core: the one Hex
      # recorded from the workload identity, else this run's commit. Hexdocs
      # source links point at it. A tag pushed with GITHUB_TOKEN starts no
      # workflow.
      - name: Tag v${{ needs.check.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          code=0
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null || code=$?
          case "$code" in
            0)
              echo "${tag} already exists."
              exit 0
              ;;
            2) ;;
            *)
              echo "::error::git ls-remote failed with status ${code}."
              exit 1
              ;;
          esac
          release_json="$(curl --silent --show-error --fail --retry 3 "https://hex.pm/api/packages/insider/releases/${VERSION}")"
          sha="$(jq --raw-output '.oidc_claims.sha // empty' <<< "$release_json")"
          sha="${sha:-$GITHUB_SHA}"
          git fetch --no-tags --depth=1 origin "$sha"
          version_at_sha="$(git show "${sha}:mix.exs" | sed -n 's/^  @version "\(.*\)"$/\1/p')"
          if [ "$version_at_sha" != "$VERSION" ]; then
            echo "::error::Commit ${sha} has version ${version_at_sha}, not ${VERSION}. Tag it by hand."
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag --annotate "$tag" "$sha" --message "Insider ${VERSION}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "refs/tags/${tag}"
          echo "::notice::Tagged ${sha} ${tag}."
